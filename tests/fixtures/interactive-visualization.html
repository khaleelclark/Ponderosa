<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fruit Sales Explorer</title>
<style>
:root{--ponderosa-bg:#fafbf8;--ponderosa-surface:#eef3ed;--ponderosa-text:#203a2b;--ponderosa-muted:#597160;--ponderosa-border:#bdcdbd;--ponderosa-accent:#33764a;--ponderosa-on-accent:white;--ponderosa-font-family:system-ui,sans-serif}
body{font:1rem/1.5 var(--ponderosa-font-family);background:var(--ponderosa-bg);color:var(--ponderosa-text);margin:0;padding:16px}*{box-sizing:border-box}h1{font-size:1.3rem;margin:0 0 12px}h2{font-size:1rem;margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.panel{padding:14px;border:1px solid var(--ponderosa-border);border-radius:12px;background:var(--ponderosa-surface);min-width:0}label{display:inline-flex;gap:8px;align-items:center;margin:4px 8px 8px 0;flex-wrap:wrap}button,input,select{font:inherit;max-width:100%;accent-color:var(--ponderosa-accent)}button{padding:8px;border-radius:8px;border:1px solid var(--ponderosa-border);background:var(--ponderosa-accent);color:var(--ponderosa-on-accent)}input,select{padding:6px;border:1px solid var(--ponderosa-border);border-radius:6px;background:var(--ponderosa-bg);color:var(--ponderosa-text)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ponderosa-accent);outline-offset:2px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:7px;text-align:left;border-bottom:1px solid var(--ponderosa-border)}th button{width:100%;text-align:left}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.875rem}.key{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px}svg,canvas{display:block;width:100%;max-width:100%}output{font-size:1.4rem;font-weight:700}.muted{color:var(--ponderosa-muted)}@media(pointer:coarse){button,input,select{min-height:44px}}
</style>
<h1>Fruit Sales Explorer</h1><div class="grid">
<section class="panel"><h2>Sales By Fruit</h2><label>Fruit <select id="fruit" aria-label="Fruit Filter"><option value="all">All Fruits</option><option>Apples</option><option>Bananas</option><option>Grapes</option><option>Oranges</option></select></label><label>View <select id="view" aria-label="Chart View"><option value="bars">Bars</option><option value="donut">Donut</option></select></label><svg id="chart" viewBox="0 0 360 220" role="img" aria-label="Fruit Sales Chart"></svg><div id="legend" class="legend"></div><p id="total" aria-live="polite"></p></section>
<section class="panel"><h2>Matching Sales Table</h2><label>Search <input id="search" aria-label="Search Fruits" placeholder="Filter fruits"></label><table><thead><tr><th id="sort-name" aria-sort="ascending"><button id="name">Fruit ↕</button></th><th id="sort-units" aria-sort="none"><button id="units">Units ↕</button></th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Filters apply to the same chart and table data.</p></section>
<section class="panel"><h2>Revenue Calculator</h2><label>Unit Price <input id="price" aria-label="Unit Price" type="range" min="1" max="20" value="5"><span id="price-value">$5</span></label><label>Quantity <input id="quantity" aria-label="Quantity" type="number" min="0" max="1000" value="10"></label><p>Revenue: <output id="revenue" aria-live="polite">$50</output></p></section>
<section class="panel"><h2>Motion Simulation</h2><p class="muted">A bouncing particle; pause at any time.</p><button id="pause" aria-pressed="false">Pause Simulation</button><label>Speed <input id="speed" aria-label="Simulation Speed" type="range" min="1" max="8" value="3"></label><canvas id="simulation" width="360" height="180" aria-label="Bouncing Particle Simulation" role="img"></canvas></section>
</div>
<script>
(()=>{
 const data=[{fruit:'Apples',units:40,color:'#db586a'},{fruit:'Bananas',units:25,color:'#d6a52b'},{fruit:'Grapes',units:20,color:'#9d74d8'},{fruit:'Oranges',units:15,color:'#ec883f'}];
 let sort='fruit',ascending=true;const el=id=>document.getElementById(id);
 const escape=text=>text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
 function render(){
  const selected=data.filter(row=>(el('fruit').value==='all'||row.fruit===el('fruit').value)&&row.fruit.toLowerCase().includes(el('search').value.toLowerCase())).sort((a,b)=>(sort==='units'?a.units-b.units:a.fruit.localeCompare(b.fruit))*(ascending?1:-1));
  const total=selected.reduce((sum,row)=>sum+row.units,0);el('rows').innerHTML=selected.map(row=>'<tr><td>'+escape(row.fruit)+'</td><td>'+row.units+'</td></tr>').join('');el('total').textContent=total+' units';
  el('legend').innerHTML=selected.map(row=>'<span><span class="key" style="background:'+row.color+'"></span>'+escape(row.fruit)+'</span>').join('');
  if(el('view').value==='bars'){el('chart').innerHTML=selected.map((row,i)=>'<g><title>'+escape(row.fruit)+': '+row.units+' units</title><text x="0" y="'+(30+i*48)+'" fill="currentColor" font-size="14">'+escape(row.fruit)+'</text><rect x="90" y="'+(12+i*48)+'" width="'+row.units*5+'" height="28" rx="4" fill="'+row.color+'"/><text x="'+(100+row.units*5)+'" y="'+(30+i*48)+'" fill="currentColor">'+row.units+'</text></g>').join('');}
  else{let offset=0;el('chart').innerHTML=selected.map(row=>{const arc=total?row.units/total*100:0,result='<circle cx="180" cy="110" r="70" fill="none" stroke="'+row.color+'" stroke-width="38" pathLength="100" stroke-dasharray="'+arc+' '+(100-arc)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 180 110)"><title>'+escape(row.fruit)+': '+row.units+' units</title></circle>';offset+=arc;return result}).join('')+'<text x="180" y="116" text-anchor="middle" fill="currentColor" font-size="20">'+total+'</text>';}
 }
 for(const id of ['fruit','view','search'])el(id).addEventListener('input',render);
 for(const key of ['name','units'])el(key).onclick=()=>{const next=key==='name'?'fruit':'units';ascending=sort===next?!ascending:true;sort=next;el('sort-name').setAttribute('aria-sort',sort==='fruit'?(ascending?'ascending':'descending'):'none');el('sort-units').setAttribute('aria-sort',sort==='units'?(ascending?'ascending':'descending'):'none');render()};
 const calculate=()=>{const price=Number(el('price').value),quantity=Number(el('quantity').value);el('price-value').textContent='$'+price;el('revenue').textContent='$'+price*quantity};for(const id of ['price','quantity'])el(id).addEventListener('input',calculate);
 let paused=matchMedia('(prefers-reduced-motion:reduce)').matches,position=0,count=0;const canvas=el('simulation'),ctx=canvas.getContext('2d');
 const pauseLabel=()=>{el('pause').textContent=paused?'Resume Simulation':'Pause Simulation';el('pause').setAttribute('aria-pressed',String(paused))};el('pause').onclick=()=>{paused=!paused;pauseLabel()};
 function animate(){if(!paused)position=(position+Number(el('speed').value))%660;ctx.clearRect(0,0,360,180);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ponderosa-accent');ctx.beginPath();ctx.arc(15+(position<=330?position:660-position),90+40*Math.sin(position/50),12,0,2*Math.PI);ctx.fill();canvas.dataset.frameCount=String(++count);requestAnimationFrame(animate)}
 pauseLabel();calculate();render();animate();
})();
</script></html>
