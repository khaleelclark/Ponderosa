packages:
  - "apps/*"
  - "packages/*"
overrides:
  find-my-way: 9.9.0
  fast-uri: 3.1.8
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  undici@6: 6.28.1
  undici@7: 7.29.1
  browserslist: 4.28.7
  '@xmldom/xmldom': 0.9.12
allowBuilds:
  onnxruntime-node: false
  '@ponderosa/native-host@file:packages/native-host': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  sharp: true

# Builds must never implicitly install dependencies or run ORT download scripts.
verifyDepsBeforeRun: false
