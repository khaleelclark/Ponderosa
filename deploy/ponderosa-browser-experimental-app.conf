[Unit]
Wants=ponderosa-browser-experimental.service
After=ponderosa-browser-experimental.service

[Service]
Environment=PONDEROSA_BROWSER_SERVICE_SOCKET=/run/ponderosa-browser-experimental/browser.sock
ExecStartPre=/usr/bin/timeout 15 /bin/sh -c 'until test -S /run/ponderosa-browser-experimental/browser.sock; do sleep 0.1; done'
