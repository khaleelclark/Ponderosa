# Pine development only. Install as ponderosa-dev.service.d/30-node24.conf.
# The release must include the verified Linux x64 Node 24 runtime.
[Service]
ExecStart=
ExecStart=/home/phoenix/ponderosa-dev/current/dist/node-runtime/linux-x64/node apps/server/dist/main.js
Environment=PATH=/home/phoenix/ponderosa-dev/current/dist/node-runtime/linux-x64:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/phoenix/.npm-global/bin
