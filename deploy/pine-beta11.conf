# Pine Beta11 server deployment. Install as ponderosa.service.d/95-beta11.conf.
# Requires the verified 832f7cda Linux bundle at /opt/ponderosa-server/current.
[Service]
WorkingDirectory=/opt/ponderosa-server/current
ExecStart=
ExecStart=/opt/ponderosa-server/current/runtime/node /opt/ponderosa-server/current/app/server/dist/main.js
Environment=PATH=/opt/ponderosa-server/current/runtime:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/phoenix/.npm-global/bin
Environment=PONDEROSA_BUILD_VERSION=0.1.0-beta.11
Environment=PONDEROSA_BUILD_SHA=832f7cda5cb12713dfca0bcfbad260eb475f980f
Environment=PONDEROSA_RELEASE_CHANNEL=beta
