<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Bounded documentation retrieval</title><desc id="desc">Version-controlled Markdown becomes a compact prompt index and on-demand pages.</desc><rect width="1280" height="720" fill="#f7f4ec"/>
  <g font-family="Inter,Arial"><text x="640" y="78" text-anchor="middle" font-size="30" font-weight="800" fill="#17352a">Documentation is referenced, not flattened</text>
  <rect x="74" y="178" width="280" height="210" rx="22" fill="#fff" stroke="#c8c3b7"/><text x="214" y="224" text-anchor="middle" font-size="20" font-weight="800" fill="#1b2b24">docs/wiki/*.md</text><text x="110" y="270" font-size="15" fill="#506059">• reviewed with product code</text><text x="110" y="302" font-size="15" fill="#506059">• durable article IDs</text><text x="110" y="334" font-size="15" fill="#506059">• screenshots + source links</text>
  <path d="M354 282H484" stroke="#d4a657" stroke-width="5"/><path d="M466 268L484 282L466 296" fill="none" stroke="#d4a657" stroke-width="5"/>
  <rect x="484" y="178" width="312" height="210" rx="22" fill="#17352a"/><text x="640" y="224" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">Compact prompt index</text><text x="526" y="270" font-size="15" fill="#d9e8df">ponderosa://docs/project-chat</text><text x="526" y="302" font-size="15" fill="#d9e8df">ponderosa://docs/triggers</text><text x="526" y="342" font-size="13" fill="#a9c3b3">No full article bodies</text>
  <path d="M796 282H926" stroke="#79a98c" stroke-width="5"/><path d="M908 268L926 282L908 296" fill="none" stroke="#79a98c" stroke-width="5"/>
  <rect x="926" y="178" width="280" height="210" rx="22" fill="#fff" stroke="#c8c3b7"/><text x="1066" y="224" text-anchor="middle" font-size="20" font-weight="800" fill="#1b2b24">ponderosa_docs</text><text x="962" y="270" font-size="15" fill="#506059">• active-Run authorization</text><text x="962" y="302" font-size="15" fill="#506059">• ordered stable refs</text><text x="962" y="334" font-size="15" fill="#506059">• byte-bounded UTF-8 pages</text>
  <rect x="214" y="486" width="852" height="112" rx="20" fill="#e4eee8"/><text x="640" y="530" text-anchor="middle" font-size="19" font-weight="800" fill="#17352a">The browser uses the same canonical index</text><text x="640" y="566" text-anchor="middle" font-size="15" fill="#506059">bounded search metadata → one requested article → related stable references</text></g>
</svg>
