<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Communication surfaces</title><desc id="desc">Broadcast, Direct Message, and Collaboration flow to their authorized views.</desc><rect width="1280" height="720" fill="#f7f4ec"/>
  <text x="640" y="72" text-anchor="middle" font-family="Inter,Arial" font-size="30" font-weight="800" fill="#17352a">One communication ledger · three immutable scopes</text>
  <g font-family="Inter,Arial"><rect x="70" y="142" width="330" height="180" rx="22" fill="#fff" stroke="#c8c3b7"/><circle cx="124" cy="196" r="24" fill="#d4a657"/><text x="164" y="201" font-size="22" font-weight="800" fill="#1b2b24">Broadcast</text><text x="104" y="246" font-size="15" fill="#506059">Project chat</text><text x="104" y="274" font-size="15" fill="#506059">Future-agent context</text><text x="104" y="302" font-size="13" fill="#78817c">Passive unless a separate Activation exists</text>
  <rect x="475" y="142" width="330" height="180" rx="22" fill="#fff" stroke="#c8c3b7"/><circle cx="529" cy="196" r="24" fill="#79a98c"/><text x="569" y="201" font-size="22" font-weight="800" fill="#1b2b24">Direct Message</text><text x="509" y="246" font-size="15" fill="#506059">Project chat + exact Agent audit</text><text x="509" y="274" font-size="15" fill="#506059">Private user ↔ Agent audience</text><text x="509" y="302" font-size="13" fill="#78817c">Never inherited as shared knowledge</text>
  <rect x="880" y="142" width="330" height="180" rx="22" fill="#fff" stroke="#c8c3b7"/><circle cx="934" cy="196" r="24" fill="#587a98"/><text x="974" y="201" font-size="22" font-weight="800" fill="#1b2b24">Collaboration</text><text x="914" y="246" font-size="15" fill="#506059">Team Chat + Agent audits</text><text x="914" y="274" font-size="15" fill="#506059">Exact Agent recipients</text><text x="914" y="302" font-size="13" fill="#78817c">Requests add correlation, not scope</text>
  <path d="M235 322V438" stroke="#d4a657" stroke-width="5"/><path d="M640 322V438" stroke="#79a98c" stroke-width="5"/><path d="M1045 322V438" stroke="#587a98" stroke-width="5"/>
  <rect x="170" y="438" width="940" height="146" rx="22" fill="#17352a"/><text x="640" y="482" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Projection never creates new authority</text><text x="640" y="522" text-anchor="middle" font-size="16" fill="#d9e8df">Stable IDs own routing · rendered #labels are presentation · scope never promotes</text><text x="640" y="552" text-anchor="middle" font-size="16" fill="#d9e8df">Ordinary provider output remains execution-scoped Work log</text></g>
</svg>
