name: Release recovery checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the pinned Chromium for browser speech checks
        run: pnpm --filter @ponderosa/server exec playwright-core install --with-deps chromium
      - name: Verify runtime recovery and browser speech ownership
        env:
          PONDEROSA_BROWSER_DISABLE_SANDBOX: "1"
        run: pnpm test:recovery
