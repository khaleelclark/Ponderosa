name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - codex/browser-experience-recovery

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium for browser checks
        run: pnpm --filter @ponderosa/server exec playwright-core install --with-deps chromium

      - name: Verify tests, types, and production build
        # GitHub's hosted Ubuntu runner disables the user namespaces Chromium's
        # sandbox requires. This exception is confined to the CI test process.
        env:
          PONDEROSA_BROWSER_DISABLE_SANDBOX: "1"
        run: |
          export PONDEROSA_BROWSER_EXECUTABLE="$(pnpm --filter @ponderosa/server exec node -p "require('playwright-core').chromium.executablePath()")"
          pnpm verify

      - name: Check read-aloud in Chromium
        run: pnpm test:speech-browser

      - name: Check bounded Agent refresh in three browser tabs
        env:
          PONDEROSA_BROWSER_DISABLE_SANDBOX: "1"
        run: |
          export PONDEROSA_CHROMIUM_PATH="$(pnpm --filter @ponderosa/server exec node -p "require('playwright-core').chromium.executablePath()")"
          node apps/web/test/request-storm-browser.check.mjs

      - name: Check browser focus, send feedback, and accessibility in Chromium
        env:
          PONDEROSA_BROWSER_DISABLE_SANDBOX: "1"
          PONDEROSA_PLAYWRIGHT_PATH: ${{ github.workspace }}/apps/server/node_modules/playwright-core/index.mjs
        run: |
          export PONDEROSA_CHROMIUM_PATH="$(pnpm --filter @ponderosa/server exec node -p "require('playwright-core').chromium.executablePath()")"
          node apps/web/test/browser-panel.check.mjs
          node apps/web/test/draft-conflict-send.check.mjs
          node apps/web/test/global-search-focus.check.mjs
          node apps/web/test/delivery-status-a11y.check.mjs
          node apps/web/test/composer-chip-accessibility.check.mjs

      - name: Qualify production-scale startup recovery
        run: pnpm --filter @ponderosa/agents qualify:startup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
