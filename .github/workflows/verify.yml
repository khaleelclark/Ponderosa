name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - codex/browser-experience-recovery

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium for browser checks
        run: pnpm --filter @ponderosa/server exec playwright-core install --with-deps chromium

      - name: Verify tests, types, and production build
        # GitHub's hosted Ubuntu runner disables the user namespaces Chromium's
        # sandbox requires. This exception is confined to the CI test process.
        env:
          PONDEROSA_BROWSER_DISABLE_SANDBOX: "1"
        run: |
          export PONDEROSA_BROWSER_EXECUTABLE="$(pnpm --filter @ponderosa/server exec node -p "require('playwright-core').chromium.executablePath()")"
          pnpm verify

      - name: Check read-aloud in Chromium
        run: pnpm test:speech-browser

      - name: Check bounded Agent refresh in three browser tabs
        env:
          PONDEROSA_BROWSER_DISABLE_SANDBOX: "1"
        run: |
          export PONDEROSA_CHROMIUM_PATH="$(pnpm --filter @ponderosa/server exec node -p "require('playwright-core').chromium.executablePath()")"
          node apps/web/test/request-storm-browser.check.mjs

      - name: Qualify production-scale startup recovery
        run: pnpm --filter @ponderosa/agents qualify:startup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
