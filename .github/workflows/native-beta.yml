name: Native private-beta artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: native-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            os: ubuntu-24.04
            format: deb
            artifact_glob: dist/installers/*.deb
          - name: macOS 15 arm64 (supports macOS 14+)
            os: macos-15
            format: dmg
            artifact_glob: dist/installers/*.dmg
          - name: Windows x64 build (Windows 11 manual gate)
            os: windows-2025
            format: exe
            artifact_glob: dist/installers/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: "true"
      PONDEROSA_RELEASE_CHANNEL: beta
      PONDEROSA_NODE_VERSION: 24.16.0
      PONDEROSA_EXPECTED_SHA: ${{ github.sha }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Assert exact source and toolchain
        shell: bash
        run: |
          expected="$PONDEROSA_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git merge-base --is-ancestor origin/master "$expected"
          else
            git merge-base --is-ancestor "$expected" origin/master
          fi
          test "$(node --version)" = "v24.16.0"
          test "$(pnpm --version)" = "11.10.0"

      - name: Resolve product version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$(node packaging/beta-version.mjs)"
          else
            version="$(node packaging/beta-version.mjs --require-tag)"
          fi
          test -n "$version"
          echo "PONDEROSA_BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Assert native host identity
        shell: bash
        run: |
          node -e "const expected={linux:'x64',darwin:'arm64',win32:'x64'}[process.platform]; if(process.arch!==expected) throw new Error('wrong runner architecture: '+process.platform+'/'+process.arch)"

      - name: Install exact dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Full verification
        shell: bash
        run: pnpm verify

      - name: Install Linux voice test sandbox dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/prepare-linux-speech-tests.sh

      - name: Verify native voice storage recovery
        shell: bash
        run: node --test apps/server/test/gui-qualification-pid.test.mjs apps/server/test/speech-sandbox.test.mjs apps/server/test/speech-cleanup-race.test.mjs apps/server/test/speech-recovery.test.mjs

      - name: Prepare checksummed official Node 24
        shell: bash
        run: node packaging/prepare-node-runtime.mjs

      - name: Build native bundle
        shell: bash
        run: node packaging/build-beta-bundle.mjs --version "$PONDEROSA_BUILD_VERSION" --channel "$PONDEROSA_RELEASE_CHANNEL"

      - name: Verify native bundle
        shell: bash
        run: node packaging/verify-beta-bundle.mjs

      - name: Restore installer build dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Inno Setup when absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: bash
        run: node packaging/package-beta.mjs --format "${{ matrix.format }}"

      - name: Collect installed qualification evidence
        shell: bash
        run: |
          artifact="$(find dist/installers -maxdepth 1 -type f -name '*.${{ matrix.format }}' -print -quit)"
          test -n "$artifact"
          report="dist/qualification/${{ matrix.format }}-native-installed-artifact.json"
          qualifier_args=(--artifact "$artifact" --report "$report")
          if [ "$RUNNER_OS" = "macOS" ]; then
            qualifier_args+=(--skip-provider-qualification)
          fi
          node packaging/qualification/qualify-installer.mjs "${qualifier_args[@]}"
          node --input-type=module --eval "
            import { appendFileSync, readFileSync } from 'node:fs';
            const result = JSON.parse(readFileSync(process.argv[1], 'utf8'));
            const blockers = result.releaseBlockers ?? [];
            console.log('Release qualified:', result.releaseQualified === true);
            console.log('External/manual release blockers:', blockers.length ? blockers.join('; ') : 'none');
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '### Installed qualification evidence\\n\\n' +
                '- Release qualified: **' + (result.releaseQualified === true ? 'yes' : 'no') + '**\\n' +
                '- External/manual blockers: ' + (blockers.length ? blockers.join('; ') : 'none') + '\\n',
            );
            if (result.releaseQualified !== true || blockers.length > 0) {
              throw new Error('installed artifact did not qualify for release');
            }
          " "$report"

      - name: Record safe failure context
        if: failure()
        shell: bash
        run: |
          mkdir -p dist/qualification
          node -e "require('node:fs').writeFileSync('dist/qualification/native-failure.json', JSON.stringify({commit:process.env.GITHUB_SHA,runner:process.env.RUNNER_OS,arch:process.arch,note:'Inspect redacted workflow step logs; no provider or signing credentials were supplied.'},null,2)+'\n')"

      - name: Stage qualified target for atomic promotion
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.format }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.artifact_glob }}
            dist/installers/*.sha256
            dist/installers/*.metadata.json
            dist/qualification/*.json

      - name: Retain failure qualification evidence
        if: failure() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: beta-failure-${{ matrix.format }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: dist/qualification/*.json

      - name: Upload native evidence for manual runs
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ponderosa-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ matrix.artifact_glob }}
            dist/installers/*.sha256
            dist/installers/*.metadata.json
            dist/beta/*/Ponderosa
            dist/beta/*/Ponderosa/build-manifest.json
            dist/beta/*/qualification-report.json
            dist/qualification/*.json

  publish:
    name: Publish complete private-beta matrix
    needs: native
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Require every qualified target before publication
        shell: bash
        run: |
          test "$(find release -type f -name '*.deb' | wc -l | tr -d ' ')" = 1
          test "$(find release -type f -name '*.dmg' | wc -l | tr -d ' ')" = 1
          test "$(find release -type f -name '*.exe' | wc -l | tr -d ' ')" = 1
          test "$(find release -type f -name '*-native-installed-artifact.json' | wc -l | tr -d ' ')" = 3

      - name: Upload to a draft, then publish atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Ponderosa $GITHUB_REF_NAME" \
              --notes "Qualified private-beta artifacts for all supported beta targets."
          fi
          find release -type f -print0 | \
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
