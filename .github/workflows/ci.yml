name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Pine
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, x64, pine]
    timeout-minutes: 20
    concurrency:
      group: ponderosa-production
      cancel-in-progress: false
    steps:
      - name: Build and restart the merged revision
        env:
          # Reserved for production deployments. Agent work happens in separate
          # checkouts/worktrees so an in-progress task cannot block deployment.
          DEPLOY_DIR: /home/phoenix/khaleel/ponderosa-deploy
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C "$DEPLOY_DIR" fetch --prune origin master
          if [ -n "$(git -C "$DEPLOY_DIR" status --porcelain)" ]; then
            git -C "$DEPLOY_DIR" status --short
            echo "Deploy checkout has local changes; refusing to overwrite them."
            exit 1
          fi
          git -C "$DEPLOY_DIR" checkout -B master "$DEPLOY_SHA"
          cd "$DEPLOY_DIR"
          pnpm install --frozen-lockfile
          pnpm build

          # The production daemon must run from the checkout that was just built.
          # Keep the source revision in the process environment so health checks
          # cannot accidentally succeed against an older process on the same port.
          sudo -n /usr/bin/systemctl stop ponderosa.service
          if [ -n "$(/usr/bin/ss -H -ltn 'sport = :8787')" ]; then
            echo "Port 8787 is still owned after ponderosa.service stopped; refusing to validate an unmanaged process."
            sudo -n /usr/bin/ss -ltnp 'sport = :8787' || true
            exit 1
          fi
          sudo -n /usr/bin/install -d -m 0755 /etc/systemd/system/ponderosa.service.d
          printf '[Service]\nWorkingDirectory=%s\nEnvironment=PONDEROSA_BUILD_SHA=%s\n' "$DEPLOY_DIR" "$DEPLOY_SHA" \
            | sudo -n /usr/bin/tee /etc/systemd/system/ponderosa.service.d/20-production-checkout.conf >/dev/null
          sudo -n /usr/bin/systemctl daemon-reload
          sudo -n /usr/bin/systemctl start ponderosa.service

      - name: Wait for the health check
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/bin/systemctl is-active --quiet ponderosa.service
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8787/api/health)"
          HEALTH_JSON="$HEALTH_JSON" node -e '
            const health = JSON.parse(process.env.HEALTH_JSON);
            if (health.status !== "ok") throw new Error(`unexpected health status: ${health.status}`);
            if (health.revision !== process.env.DEPLOY_SHA) {
              throw new Error(`stale Ponderosa daemon: expected ${process.env.DEPLOY_SHA}, received ${health.revision ?? "no revision"}`);
            }
            process.stdout.write(`${JSON.stringify(health)}\n`);
          '
