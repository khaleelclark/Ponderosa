name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Pine
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, x64, pine]
    timeout-minutes: 20
    concurrency:
      group: ponderosa-production
      cancel-in-progress: false
    steps:
      - name: Build and restart the merged revision
        env:
          # Reserved for production deployments. Agent work happens in separate
          # checkouts/worktrees so an in-progress task cannot block deployment.
          DEPLOY_DIR: /home/phoenix/khaleel/ponderosa-deploy
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C "$DEPLOY_DIR" fetch --prune origin master
          if [ -n "$(git -C "$DEPLOY_DIR" status --porcelain)" ]; then
            git -C "$DEPLOY_DIR" status --short
            echo "Deploy checkout has local changes; refusing to overwrite them."
            exit 1
          fi
          git -C "$DEPLOY_DIR" checkout -B master "$DEPLOY_SHA"
          cd "$DEPLOY_DIR"
          pnpm install --frozen-lockfile
          pnpm build
          sudo -n /usr/bin/systemctl restart ponderosa.service

      - name: Wait for the health check
        run: curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8787/api/health
