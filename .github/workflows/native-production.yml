name: Native production release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated stable tag (vMAJOR.MINOR.PATCH) on the exact origin/master commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-production-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify Ubuntu 24.04 x64
    environment: production-release
    runs-on: [self-hosted, ponderosa-release, linux, x64]
    timeout-minutes: 90
    env:
      CI: "true"
      PONDEROSA_NODE_VERSION: 24.16.0
      PONDEROSA_RELEASE_CHANNEL: production
      PONDEROSA_REQUIRE_SIGNED_RELEASE: "true"
      PONDEROSA_RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Prove stable release authority
        shell: bash
        run: |
          tag="$PONDEROSA_RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          test "$(node --version)" = v24.16.0
          version="${tag#v}"
          echo "PONDEROSA_BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install exact dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Full verification and production audit
        shell: bash
        run: |
          pnpm verify
          pnpm --filter @ponderosa/agents qualify:startup
          pnpm audit --prod --audit-level=high

      - name: Prepare and build exact native bundle
        shell: bash
        run: |
          node packaging/prepare-node-runtime.mjs
          node packaging/build-beta-bundle.mjs --version "$PONDEROSA_BUILD_VERSION" --channel production
          node packaging/verify-beta-bundle.mjs
          pnpm install --frozen-lockfile

      - name: Build signed installer
        shell: bash
        run: node packaging/package-beta.mjs --format deb

      - name: Qualify installed artifact with providers
        shell: bash
        run: |
          artifact="$(find dist/installers -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$artifact"
          report="dist/qualification/linux-production.json"
          node packaging/qualification/qualify-installer.mjs --artifact "$artifact" --report "$report"
          node packaging/qualification/enforce-release-policy.mjs \
            --metadata "$artifact.metadata.json" \
            --qualification "$report" \
            --commit "$GITHUB_SHA" \
            --version "$PONDEROSA_BUILD_VERSION" \
            --platform linux

      - name: Upload qualified target for atomic promotion
        uses: actions/upload-artifact@v4
        with:
          name: production-linux-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/installers/*
            dist/qualification/*.json

  publish:
    name: Attest and publish complete release
    needs: qualify
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: production-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Require the qualified Linux target
        shell: bash
        run: |
          test "$(find release -type f -name '*.deb' | wc -l | tr -d ' ')" = 1
          test "$(find release -type f -name '*-production.json' | wc -l | tr -d ' ')" = 1

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.deb

      - name: Publish only after the complete matrix passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PONDEROSA_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$PONDEROSA_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$PONDEROSA_RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$PONDEROSA_RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$PONDEROSA_RELEASE_TAG" --verify-tag --draft \
              --title "Ponderosa $PONDEROSA_RELEASE_TAG" \
              --notes "Qualified Linux x64 production artifact."
          fi
          find release -maxdepth 1 -type f -print0 |
            xargs -0 gh release upload "$PONDEROSA_RELEASE_TAG" --clobber
          gh release edit "$PONDEROSA_RELEASE_TAG" --draft=false
